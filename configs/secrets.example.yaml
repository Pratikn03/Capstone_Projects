# Example only. Copy to a local gitignored path or managed secret payload and
# replace every value with 32+ byte random material. Do not commit real secrets.
# Keep current and next IDs available during rotation; select the active
# certificate key with ORIUS_CERTIFICATE_ACTIVE_KEY_ID.

certificate_keys:
  orius-cert-2026-01: "replace-with-strong-local-hmac-secret"
  orius-cert-2026-02: "replace-with-next-rotation-secret"

device_keys:
  edge-device-001:
    edge-key-2026-01: "replace-with-device-hmac-secret"
    edge-key-2026-02: "replace-with-next-device-hmac-secret"

revoked_device_keys:
  edge-device-retired-001:
    - "edge-key-2025-12"
  edge-device-001:
    - "edge-key-2025-12"

api_keys:
  local-admin-key:
    - "read"
    - "write"
    - "admin"

rotation_metadata:
  owner: "replace-with-oncall-or-secret-owner"
  overlap_window: "replace-with-duration-such-as-7d"
  certificate_active_key_id: "orius-cert-2026-01"
  next_certificate_key_id: "orius-cert-2026-02"
  notes: "metadata only; runtime reads certificate_keys, device_keys, revoked_device_keys, and api_keys"
