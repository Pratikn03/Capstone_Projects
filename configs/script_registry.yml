# ORIUS script governance registry.
#
# Every tracked or untracked `scripts/*.py` must either be referenced from
# Makefile/docs/tests/another script, or listed here with an explicit status and
# reason. This keeps one-off Codex/AI helpers from silently becoming part of the
# release surface.
scripts:
  scripts/build_theorem_summary_figures.py:
    status: manual
    reason: "Manual theorem-figure rebuild helper retained for publication refreshes outside the default gate."
  scripts/recalibrate_conformal_from_backtests.py:
    status: manual
    reason: "Manual calibration-maintenance helper for backtest reruns, not a default release entrypoint."
  scripts/run_theorem_evidence_av.py:
    status: manual
    reason: "Manual AV theorem-evidence refresh helper used after local AV data reruns."
  scripts/run_theorem_evidence_battery.py:
    status: manual
    reason: "Manual battery theorem-evidence refresh helper used after local battery reruns."
  scripts/run_theorem_evidence_healthcare.py:
    status: manual
    reason: "Manual healthcare theorem-evidence refresh helper used after local held-out replay reruns."
  scripts/summarize_split_training.py:
    status: manual
    reason: "Manual split-training summarizer for local max-run reconciliation."

legacy_manual_scripts:
  reason: "Historical ORIUS helper retained outside the default release path; requires explicit invocation or a future refactor before becoming a release gate."
